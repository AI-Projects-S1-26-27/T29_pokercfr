name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned: torch and open_spiel have no 3.14 wheels.
          python-version: "3.12"
      - run: pip install -e ".[verify,dev]"
      - run: ruff check .
      # Includes the OpenSpiel cross-validation tests. They skip if pyspiel is
      # missing, so a failure here means a real disagreement, not a bad install.
      - run: pytest -q
